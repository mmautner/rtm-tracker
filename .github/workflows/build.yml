# Validate the data and build the site on every push and pull request.
# Publishing is done locally with ./deploy.sh (S3 + CloudFront, like the sibling sites);
# this workflow guarantees that what's on main always validates and builds.
name: Validate and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the changelog page is built from it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate data (fails on a missing source URL or an invalid status)
        run: python scripts/validate.py
      - name: Build site
        run: python build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 14
