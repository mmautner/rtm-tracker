# Weekly check of every source URL. Opens one issue per broken link (label: broken-link).
name: Link check

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check source links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_links.py --open-issues
