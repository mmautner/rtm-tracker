# ---------------------------------------------------------------- meetings

- id: ioc-meeting-2026-03-06
  kind: meeting
  date: 2026-03-06
  title: First meeting
  actions: >-
    Elected Sue Noack Chair and Jeff Gee Vice Chair. Received an introduction to SB 63, the review's scope
    and timeline, and the consultant team.
  vote_record: "Chair and Vice Chair each elected 9-0 (all voting members present)."
  status_as_of: 2026-11-05
  sources:
    - title: "Oversight Committee draft minutes, March 6, 2026 (approved April 17, 2026)"
      url: https://mtc.ca.gov/sites/default/files/meetings/attachments/6607/3a_26_0477_March_6_2026_Draft_Meeting_Minutes.pdf
      page: "1-2"
      type: agency_document
  notes: null

- id: ioc-meeting-2026-04-17
  kind: meeting
  date: 2026-04-17
  title: Draft Phase 1 report presented
  actions: >-
    Received the consultant's draft Phase 1 report and gave initial feedback; no action was required.
    Approved the March 6 minutes. Written comments came from committee member Lou Thompson, SPUR, the Bay
    Area Council, and MTC Commissioner Gina Papan.
  vote_record: "Consent calendar (March 6 minutes) approved 6-0. Absent: Hernandez, Thompson, Whelan."
  status_as_of: 2026-11-05
  sources:
    - title: "Oversight Committee draft minutes, April 17, 2026 (approved May 22, 2026)"
      url: https://mtc.ca.gov/sites/default/files/meetings/attachments/6632/3a_26_0625_April_17_2026_Draft_Meeting_Minutes.pdf
      page: "1-2"
      type: agency_document
  notes: null

- id: ioc-meeting-2026-05-22
  kind: meeting
  date: 2026-05-22
  title: Final Phase 1 report adopted
  actions: >-
    Adopted the final Phase 1 analysis. MTC's release says the committee also directed staff to make minor
    revisions and add one early action strategy. Approved the April 17 minutes. Written comments came from
    MTC Commissioner Gina Papan and committee member Lou Thompson.
  vote_record: "Final Phase 1 analysis adopted 7-0 (motion Noack, second McCalley). Absent: Rosenfield, Whelan."
  status_as_of: 2026-11-05
  sources:
    - *may22_minutes
    - title: "MTC news release: Independent Oversight Committee Approves Transit Agencies' Financial Efficiency Review (May 27, 2026)"
      url: https://mtc.ca.gov/news/independent-oversight-committee-approves-transit-agencies-financial-efficiency-review
      page: null
      type: news_release
  notes: The minutes cited are the draft placed on the Oct. 21, 2026 agenda for approval.

- id: ioc-meeting-2026-10-21
  kind: meeting
  date: 2026-10-21
  title: Phase 2 scope and approach discussed
  actions: >-
    Information and discussion item: MTC staff presented a proposed approach for Phase 2 (contingent on the
    measure passing), covering process, deliverables, timeline, and consultant qualifications, and asked
    for the committee's input before writing the consultant scope of work and request for proposals. The
    May 22 minutes were on the consent calendar.
  vote_record: null
  status_as_of: 2026-11-05
  sources:
    - *oct_agenda
    - title: "Oversight Committee, Oct. 21, 2026, item 4a: Phase Two Financial Efficiency Review, Scope and Approach Discussion (summary sheet)"
      url: https://mtc.ca.gov/sites/default/files/meetings/attachments/2539/4a_26_2068_1_Summary_Sheet_Phase_Two_Financial_Efficiency_Review_Scope_Approach.pdf
      page: "1-3"
      type: agency_document
  notes: Minutes not yet posted; they are normally approved at the committee's next meeting.

