# Commitments tracked for SB 63 / Measure RTM.
# One entry per recommended action. See README.md for how to add or update an entry,
# and the Methodology page for what each status means.
# action_type: action | study | advocacy  (what the recommendation commits the agency to do; see schema.py)
# status: null | not_adopted | not_started | adopted | in_progress | implemented | missed | superseded

# ---------------------------------------------------------------- AC Transit

- id: ac-transit-p1-fare-compliance-study
  agency: AC Transit
  phase: 1
  recommendation: >-
    Study fare compliance and enforcement: measure how many riders do not pay and why, identify
    the staff, technology, and administrative resources needed to improve compliance, and develop
    a funding and implementation plan.
  category: revenue
  action_type: study
  action_type_basis: "Study fare compliance and enforcement"
  estimated_savings_usd: null
  savings_basis: "The Phase 1 report does not estimate savings for this strategy."
  required_by: m-2026-07-01-operator-adoption
  target_completion: "2029-06"
  target_completion_basis: "Estimated completion date in MTC Res. 4743, Attachment A."
  board_action:
    date: 2026-06-10
    description: >-
      Board motion (Shaw/McCalley; 6 ayes, 1 absent) to receive the Phase 1 report and adopt the
      early action strategies as recommended by staff, with the addition of adopting the schedule
      efficiencies study that benefits riders.
