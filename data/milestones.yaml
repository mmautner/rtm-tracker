- id: m-2026-11-03-election
  title: Election on the Regional Transit Measure (RTM)
  short_title: Election
  responsible: voters
  statute: Gov. Code §67740(a)
  deadline: 2026-11-03
  deadline_rule: null
  completed_on: 2026-11-03
  outcome: >-
    The election was held November 3, 2026. MTC's November 4, 2026 release, based on results
    reported so far, states that voters "appear to have approved the Regional Transit Measure
    (RTM)." Certified results have not yet been recorded here.
  estimates: []
  status_as_of: 2026-11-04
  sources:
    - title: "SB 63 (Wiener), Stats. 2025, Ch. 740, Gov. Code §67740(a)"
      url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB63
      page: 7
      type: statute
    - title: "MTC: Bay Area Voters Show Strong Support for Public Transit (Nov. 4, 2026)"
      url: https://mtc.ca.gov/news/bay-area-voters-show-strong-support-public-transit
      page: null
      type: news_release

