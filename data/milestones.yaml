# Statutory milestones for the SB 63 financial efficiency review (Gov. Code §67766).
#
# A milestone has either a fixed `deadline` or a `deadline_rule` ("N days after milestone X").
# When X gets a `completed_on` date, the site computes this milestone's deadline from it.
# Example: set completed_on on m-election-certified and the Phase 2 deadline appears.
#
# `estimates` are timelines that MTC or an agency has published. The site shows them
# beside the statutory rule, labeled as estimates, with their source.
# Page numbers for the statute refer to the PDF of the chaptered bill (Ch. 740), also
# kept in sources/sb63-chaptered.pdf.

- id: m-2026-05-22-phase1-final
  title: Oversight committee adopts final Phase 1 analysis
  short_title: Final Phase 1 analysis adopted
  responsible: oversight committee
  statute: Gov. Code §67766(a)
  deadline: null
  deadline_rule: null
  completed_on: 2026-05-22
  outcome: >-
    The Financial Efficiency Review Independent Oversight Committee adopted the Phase 1 report on
    May 22, 2026, and directed staff to make minor revisions and add one early action strategy.
    The revised report was posted May 27, 2026.
  estimates: []
  status_as_of: 2026-11-04
  sources:
    - title: "SB 63 (Wiener), Stats. 2025, Ch. 740, Gov. Code §67766(a)"
      url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB63
      page: 14
      type: statute
    - title: "MTC: Independent Oversight Committee Approves Transit Agencies' Financial Efficiency Review (May 27, 2026)"
      url: https://mtc.ca.gov/news/independent-oversight-committee-approves-transit-agencies-financial-efficiency-review
      page: null
      type: news_release

- id: m-2026-07-01-operator-adoption
  title: Each agency identifies the Phase 1 strategies it commits to and adopts them as policy or budget actions
  short_title: Agencies adopt Phase 1 strategies
  responsible: operators
  statute: Gov. Code §67766(b)
  deadline: 2026-07-01
  deadline_rule: null
  completed_on: 2026-06-16
  outcome: >-
    All four boards acted before the deadline: Caltrain on June 4, AC Transit on June 10, BART on
    June 11, and SFMTA on June 16, 2026. MTC reports that 29 of 32 early action strategies were
    adopted in whole or in part. The completion date shown is the last of the four actions.
  estimates: []
  status_as_of: 2026-11-04
  sources:
    - title: "SB 63 (Wiener), Stats. 2025, Ch. 740, Gov. Code §67766(b)"
      url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB63
      page: 14
      type: statute
    - title: "MTC Programming and Allocations Committee, Agenda Item 3a-26-0808, Summary Sheet (Aug. 12, 2026)"
      url: https://mtc.ca.gov/sites/default/files/meetings/attachments/6681/9a_26_0946_1_Summary_Sheet_FY25_26_PIP_ACTransit_SFMTA_BART.pdf
      page: 2
      type: board_item
    - title: "Caltrain (Peninsula Corridor JPB) Board of Directors, Minutes of June 4, 2026, item 12"
      url: https://www.caltrain.com/media/37536/download
      page: 5
      type: board_item
    - title: "AC Transit Board of Directors, Master Minute Order, Report ID 26-209 (June 10, 2026)"
      url: https://actransit.legistar1.com/actransit/attachments/28a6060f-8654-4daa-976c-c838ece127de.pdf
      page: 1
      type: board_item
    - title: "BART Board adopts FY27 budget with $18M in cuts and reductions in employee headcount (June 11, 2026)"
      url: https://www.bart.gov/news/articles/2026/news20260611
      page: null
      type: news_release
    - title: "SFMTA Board of Directors Resolution No. 260616-052 (June 16, 2026)"
