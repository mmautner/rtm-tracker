- id: m-impl-plan-final
  title: Each agency's board adopts a final implementation plan
  short_title: Final implementation plans adopted
  responsible: operators
  statute: Gov. Code §67766(f)
  deadline: null
  deadline_rule:
    after: m-impl-plan-ioc-review
    days: 60
  completed_on: null
  outcome: >-
    After adoption, each agency must follow its plan until the tax expires, and must verify its
    compliance with MTC as a condition of continued funding. MTC must give an agency 90 days to
    comply before withholding funds (§67766(g)-(h)).
  estimates:
    - text: "MTC: \"by early 2028, all four agencies supported by the measure would be required to adopt and adhere\" to cost-savings plans."
      source:
        title: "MTC: Bay Area Voters Show Strong Support for Public Transit (Nov. 4, 2026)"
        url: https://mtc.ca.gov/news/bay-area-voters-show-strong-support-public-transit
        page: null
        type: news_release
    - text: "Caltrain staff: \"Operators must adopt an implementation plan by August 2028.\""
      source:
        title: "Caltrain staff presentation, Adopt SB63 Phase 1 Financial Efficiency Review Early Action Strategies (June 4, 2026)"
        url: https://www.caltrain.com/media/37136/download
        page: 8
        type: board_item
  status_as_of: 2026-11-04
  sources:
    - title: "SB 63 (Wiener), Stats. 2025, Ch. 740, Gov. Code §67766(f)-(h)"
      url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB63
      page: "15-16"
      type: statute
